version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # pnpm keeps a single lockfile at the workspace root, so one updater rooted
  # here covers every package. A directory-scoped updater finds no lockfile and
  # leaves it stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "@playwright/*"
          - "jsdom"
      build-tools:
        patterns:
          - "tsdown"
          - "vite"
          - "@vitejs/*"
          - "@babel/*"
          - "babel-plugin-*"
      types:
        patterns:
          - "@types/*"
      tooling:
        patterns:
          - "*"
